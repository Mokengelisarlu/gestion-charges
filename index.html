<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion des charges</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f6f4a">
<style>
:root{--bg:#f5f7f6;--card:#fff;--tx:#18221d;--mu:#6b7a72;--bd:#e3e9e6;--pr:#1f6f4a;--pr2:#17593a;--soft:#e9f3ee;--r:#d93025;--rsoft:#fdecea;--a:#b7791f;--asoft:#fdf4e3;--v:#15803d;--vsoft:#e8f6ed;--side:#101a15;--sideTx:#9fb3a9;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh2:0 10px 30px rgba(16,24,40,.12);--rl:14px;--rm:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--card:#171f1b;--tx:#e6eee9;--mu:#8fa198;--bd:#26302a;--pr:#35a56f;--pr2:#2b8a5c;--soft:#153024;--vsoft:#132a1c;--asoft:#2a2312;--rsoft:#2d1614;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px;border-radius:6px}
.shell{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:244px;background:var(--side);color:var(--sideTx);display:flex;flex-direction:column;z-index:60;transition:transform .2s ease}
.brand{display:flex;align-items:center;gap:10px;padding:18px;color:#fff;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#35a56f,#1f6f4a);display:grid;place-items:center;font-size:17px;flex:none}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--sideTx);opacity:.75}
.nav{flex:1;padding:6px 0;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;width:calc(100% - 20px);margin:2px 10px;padding:10px 12px;border:0;border-radius:9px;background:none;color:var(--sideTx);cursor:pointer;font-size:14px;font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button svg{opacity:.7;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(53,165,111,.16);color:#fff}
.nav button.on svg{opacity:1;color:#4cc98a}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.6}
.side-foot b{color:#dfe9e4}.side-foot a{color:#7dd3a8;text-decoration:none}
.content{flex:1;margin-left:244px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd)}
.topbar .ttl{font-weight:700;font-size:16px;letter-spacing:-.01em}
.topbar .sp{flex:1}
.brg{display:none;background:none;border:1px solid var(--bd);border-radius:8px;padding:7px;cursor:pointer;line-height:0;color:var(--tx)}
.u{background:var(--soft);color:var(--pr);border:1px solid transparent;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
.u:hover{filter:brightness(.96)}
main{width:100%;max-width:1080px;margin:0 auto;padding:24px;flex:1;min-height:70vh}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
h3{margin:0 0 12px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:16px;box-shadow:var(--sh)}
.kpi .ki{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--pr);margin-bottom:10px}
.kpi .ki.a{background:var(--asoft);color:var(--a)}.kpi .ki.r{background:var(--rsoft);color:var(--r)}.kpi .ki.v{background:var(--vsoft);color:var(--v)}.kpi .ki.n{background:#eef2f0;color:var(--mu)}
@media(prefers-color-scheme:dark){.kpi .ki.n{background:#222c26}}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--mu);font-size:12.5px}.kpi small{display:block;font-size:12px;margin-top:3px}
input,select,button.b{padding:9px 12px;border:1px solid var(--bd);border-radius:var(--rm);background:var(--card);color:var(--tx);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--soft)}
button.b{background:var(--pr);color:#fff;border:0;cursor:pointer;font-weight:600;font-size:14px}
button.b:hover{background:var(--pr2)}
button.b.s{background:var(--card);color:var(--pr);border:1px solid var(--pr)}
button.b.s:hover{background:var(--soft)}
button.b.d{background:var(--card);color:var(--r);border:1px solid var(--r)}
button.b.d:hover{background:var(--rsoft)}
button.b.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
button.b.big{width:100%;font-size:16px;padding:13px;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>input,.row>select{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:600;text-align:left;padding:10px;border-bottom:1px solid var(--bd)}
td{padding:12px 10px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(127,147,136,.05)}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p0{background:#eef2f0;color:var(--mu)}.pr{background:var(--rsoft);color:var(--r)}.pa{background:var(--asoft);color:var(--a)}.pv{background:var(--vsoft);color:var(--v)}
.x{text-decoration:line-through;opacity:.55}.ina{opacity:.55}.mu{color:var(--mu)}.up{color:var(--v)}.dn{color:var(--r)}
.ch{display:flex;gap:6px;align-items:flex-end;height:200px;min-width:max-content}
.bc{flex:1;min-width:42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars{display:flex;gap:3px;align-items:flex-end;height:130px;width:100%}
.bars i{flex:1;min-height:3px;border-radius:4px 4px 0 0;transition:height .3s}
.bc small{font-size:11px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 12px}
.meter{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;min-width:80px}
.meter div{height:100%;background:linear-gradient(90deg,var(--pr),#35a56f);border-radius:99px}
.toast{position:fixed;bottom:24px;right:24px;background:#14201a;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;box-shadow:var(--sh2);font-weight:600;font-size:14px;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
footer{text-align:center;padding:18px;color:var(--mu);font-size:13px;border-top:1px solid var(--bd)}footer a{color:var(--pr);text-decoration:none;font-weight:600}
.po{display:none}.ov{display:none}
@media(max-width:900px){.brg{display:block}.side{transform:translateX(-100%);box-shadow:var(--sh2)}body.open .side{transform:none}body.open .ov{display:block;position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50}.content{margin-left:0}.topbar{padding:10px 14px}main{padding:14px}}
@media(max-width:640px){table,tbody{display:block}tr:first-child{display:none}tr{display:block;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card);box-shadow:var(--sh)}td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;padding:5px 0}td::before{content:attr(data-l);color:var(--mu);font-size:12.5px;flex:none}td[colspan]::before{content:''}}
@media print{.side,.topbar,.np,.ov{display:none!important}.content{margin:0}body{background:#fff;color:#000}.card,.kpi{border-color:#999;box-shadow:none;break-inside:avoid}.po{display:block}main{max-width:none;padding:0}.tw{overflow:visible}.pr-sign{margin-top:40px;display:flex;justify-content:space-around}}
</style></head><body>
<div class="shell">
<aside class="side">
<div class="brand"><span class="logo">🚚</span><span>Gestion des charges<small>Coopérative · Camions</small></span></div>
<nav class="nav" id="nav"></nav>
<div class="side-foot">Développé par <b>Anaclet Mwela</b><br><a href="tel:+243999786858">+243 999 786 858</a></div>
</aside>
<div class="ov" onclick="document.body.classList.remove('open')"></div>
<div class="content">
<header class="topbar" id="hd"></header>
<main id="app"></main>
<footer>Fonctionne hors-ligne · Données stockées localement sur cet appareil</footer>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const ICO={dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',truck:'<path d="M14 18V6a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h1"/><path d="M14 9h4l4 4v5a1 1 0 0 1-1 1h-2"/><path d="M9 18h4"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',chart:'<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',set:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',menu:'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'};
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]||''}</svg>`;
const kpi=(i,l,v,t,x)=>`<div class="kpi"><div class="ki ${t||''}">${ico(i)}</div><b>${v}</b><span>${l}</span>${x||''}</div>`;
let db,S={clients:[],camions:[],charges:[],chargements:[],q:3,clot:[]},tab='dash',F={q:'',from:'',to:'',type:''},CQ='',KQ='',FC=0,CJ='';
const R={from:dk(Date.now()-6*864e5),to:dk(Date.now()),g:'jour',inact:7};
const TABS=[['dash','Tableau de bord','dash'],['cli','Clients','users'],['cam','Camions','truck'],['load','Chargement','box'],['hist','Historique','hist'],['rap','Rapports','chart'],['set','Réglages','set']];
const STO=['clients','camions','charges','chargements'];
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('charges-db',1);r.onupgradeneeded=()=>{STO.forEach(n=>r.result.createObjectStore(n,{keyPath:'id',autoIncrement:true}));r.result.createObjectStore('reglages',{keyPath:'k'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const tx=(s,m,f)=>new Promise((ok,ko)=>{const t=db.transaction(s,m);const rq=f(t.objectStore(s));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>ko(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),clr=s=>tx(s,'readwrite',o=>o.clear());
async function load(){for(const s of STO)S[s]=await all(s);const r=await all('reglages');S.q=(r.find(x=>x.k==='quota')||{v:3}).v;S.clot=(r.find(x=>x.k==='clot')||{v:[]}).v}
const day=t=>new Date(t).toDateString();
async function autoReset(){for(const c of S.camions)if(c.etat==='charge'&&day(c.chargeLe)!==day(Date.now())){c.etat='dispo';await put('camions',c)}}
const nm=id=>(S.clients.find(c=>c.id===id)||{}).nom||'?',pl=id=>(S.camions.find(c=>c.id===id)||{}).plaque||'?';
const solde=id=>S.charges.filter(x=>x.clientId===id&&!x.annule).reduce((a,x)=>a+x.n,0)-S.chargements.filter(x=>x.clientId===id&&!x.annule).reduce((a,x)=>a+x.quota,0);
function badge(s){const q=S.q;const c=s>=q?'pv':s>=q*2/3&&s>0?'pa':s>0?'pr':'p0';const l=s>=q?'Droit au camion':c==='pa'?'Ambre':c==='pr'?'Rouge':'Aucune';return `<span class="pill ${c}">${s} / ${q} · ${l}</span>`}
const fd=t=>new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const lab=c=>c.nom+(c.tel?' · '+c.tel:'');
const findCli=v=>{v=v.trim().toLowerCase();const a=S.clients.filter(c=>!c.inactif);return a.find(c=>lab(c).toLowerCase()===v)||a.find(c=>c.nom.toLowerCase()===v)};
const chf=k=>k.chauffeurId?nm(k.chauffeurId):(k.chauffeur||'');
const chl=k=>{const c=S.clients.find(c=>c.id===k.chauffeurId);return c?lab(c):(k.chauffeur||'')};
const camLab=k=>k.plaque+(chf(k)?' · '+chf(k):'');
const dlist=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const AC=()=>S.clients.filter(c=>!c.inactif),AK=()=>S.camions.filter(k=>!k.inactif);
const DL=()=>dlist('dl-cli',AC().map(lab))+dlist('dl-names',[...new Set([...S.clients.map(c=>c.nom),...S.camions.map(k=>k.plaque)])])+dlist('dl-lc',AC().filter(c=>solde(c.id)>=S.q).map(lab))+dlist('dl-lk',AK().filter(k=>k.etat!=='charge').map(camLab));
const ev=()=>[...S.charges.map(x=>({t:'charge',...x})),...S.chargements.map(x=>({t:'chargement',...x}))].sort((a,b)=>b.date-a.date);
const rng=()=>[F.from?new Date(F.from+'T00:00:00').getTime():0,F.to?new Date(F.to+'T23:59:59').getTime():1e15];
function filt(){const [f,t]=rng(),q=F.q.toLowerCase();return ev().filter(e=>e.date>=f&&e.date<=t&&(!F.type||e.t===F.type)&&(!q||(nm(e.clientId)+' '+(e.camionId?pl(e.camionId):'')).toLowerCase().includes(q)))}
const norm=p=>p.toUpperCase().replace(/[\s-]/g,'');
const blk=t=>{if(S.clot.some(c=>c.jour===dk(t))){alert('La journée du '+dk(t)+' est clôturée. Rouvrez-la depuis le tableau de bord pour modifier.');return true}return false};
const mob=()=>document.querySelectorAll('table').forEach(t=>{const h=[...t.rows[0].cells].map(c=>c.textContent);[...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=h[i]||''))});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
async function refresh(){await load();render()}

/* ---- actions ---- */
async function addClient(){const n=$('#cn').value.trim(),t=$('#ct').value.trim();if(!n)return alert('Nom requis');
 const dup=S.clients.find(c=>!c.inactif&&(c.nom.toLowerCase()===n.toLowerCase()||(t&&c.tel===t)));
 if(dup&&!confirm(`Un client similaire existe déjà : ${dup.nom} ${dup.tel||''}.\nCréer quand même ?`))return;
 await put('clients',{nom:n,tel:t,date:Date.now()});refresh()}
async function editClient(id){const c=S.clients.find(x=>x.id===id),n=prompt('Nom du client :',c.nom);if(n===null)return;if(!n.trim())return alert('Nom requis');const t=prompt('Téléphone :',c.tel||'');if(t===null)return;c.nom=n.trim();c.tel=t.trim();await put('clients',c);refresh()}
async function addCamion(){const p=$('#kp').value.trim(),c=findCli($('#kc').value);if(!p)return alert('Immatriculation requise');
 if(!c)return alert('Le chauffeur doit être un client enregistré : choisissez-le dans la liste.');
 if(S.camions.some(k=>norm(k.plaque)===norm(p)))return alert('Cette immatriculation existe déjà.');
 await put('camions',{plaque:p.toUpperCase(),chauffeurId:c.id,etat:'dispo',date:Date.now()});refresh()}
async function editCamion(id){const k=S.camions.find(x=>x.id===id),p=prompt('Immatriculation :',k.plaque);if(p===null||!p.trim())return;if(S.camions.some(x=>x.id!==id&&norm(x.plaque)===norm(p)))return alert('Cette immatriculation existe déjà.');k.plaque=p.trim().toUpperCase();await put('camions',k);refresh()}
async function setChauffeur(id,v){const k=S.camions.find(c=>c.id===id),c=findCli(v);if(!c){alert('Le chauffeur doit être un client enregistré.');return refresh()}k.chauffeurId=c.id;delete k.chauffeur;await put('camions',k);refresh()}
async function toggle(s,id){const o=S[s].find(x=>x.id===id);if(!o.inactif&&!confirm('Désactiver « '+(o.nom||o.plaque)+' » ? Il ne sera plus proposé, mais son historique est conservé.'))return;o.inactif=!o.inactif;await put(s,o);refresh()}
async function merge(){const src=S.clients.find(c=>c.id===FC),t=findCli($('#fm').value);if(!t||t.id===FC)return alert('Choisissez un autre client dans la liste');
 if(!confirm(`Fusionner « ${src.nom} » dans « ${t.nom} » ?\nCharges, chargements et camions seront transférés. « ${src.nom} » sera désactivé.`))return;
 for(const x of S.charges.filter(x=>x.clientId===FC)){x.clientId=t.id;await put('charges',x)}
 for(const x of S.chargements.filter(x=>x.clientId===FC)){x.clientId=t.id;await put('chargements',x)}
 for(const k of S.camions.filter(k=>k.chauffeurId===FC)){k.chauffeurId=t.id;await put('camions',k)}
 src.inactif=true;src.fusionneVers=t.id;await put('clients',src);FC=t.id;refresh()}
async function addCharge(id,n,date){n=parseInt(n);if(!n||n<1)return;date=date||Date.now();if(blk(date))return;await put('charges',{clientId:id,n,date,cree:Date.now()});await refresh();toast('+'+n+' charge(s) · '+nm(id))}
function askCharge(id){addCharge(id,prompt('Nombre de charges à octroyer à '+nm(id)+' :','1'))}
function quick(){const c=findCli($('#qc').value);if(!c)return alert('Choisissez un client dans la liste');const v=$('#qd').value,d=v?new Date(v).getTime():Date.now();if(d>Date.now()+6e4)return alert('La date ne peut pas être dans le futur');addCharge(c.id,$('#qn').value,d)}
function autoCam(){const c=findCli($('#lc').value);if(!c)return;const k=AK().find(k=>k.chauffeurId===c.id&&k.etat!=='charge');if(k&&!$('#lk').value)$('#lk').value=camLab(k)}
async function doLoad(){const cc=findCli($('#lc').value),k=AK().find(c=>camLab(c).toLowerCase()===$('#lk').value.trim().toLowerCase());if(!cc||!k)return alert('Choisissez un client et un camion dans les listes');const ci=cc.id;
 if(k.etat==='charge')return alert('Ce camion est déjà chargé');if(solde(ci)<S.q)return alert('Quota non atteint');if(blk(Date.now()))return;
 const id=await tx('chargements','readwrite',o=>o.add({clientId:ci,camionId:k.id,quota:S.q,date:Date.now(),cree:Date.now()}));
 k.etat='charge';k.chargeLe=Date.now();k.dernier=id;await put('camions',k);await refresh();toast('Chargement enregistré')}

 const st=E=>({c:E.filter(e=>e.t==='charge').reduce((s,e)=>s+e.n,0),l:E.filter(e=>e.t==='chargement').length,k:new Set(E.filter(e=>e.t==='chargement').map(e=>e.camionId)).size,u:new Set(E.map(e=>e.clientId)).size});
 const bkt=x=>{if(R.g==='mois')return x.slice(0,7);if(R.g==='semaine'){const d=new Date(x+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)}return x},B={};
 if(R.g==='jour')for(let d=f;d<=t;d+=864e5)B[dk(d)]={c:0,l:0};
 E.forEach(e=>{const k=bkt(dk(e.date));B[k]??={c:0,l:0};e.t==='charge'?B[k].c+=e.n:B[k].l++});
 const bc={},bk={};E.forEach(e=>{const o=bc[e.clientId]??={c:0,l:0};e.t==='charge'?o.c+=e.n:o.l++;if(e.t==='chargement'){const q=bk[e.camionId]??={l:0,d:new Set(),cl:new Set()};q.l++;q.d.add(dk(e.date));q.cl.add(nm(e.clientId))}});
 const use=AK().map(k=>{const q=bk[k.id];return{k,l:q?q.l:0,d:q?q.d.size:0,pct:Math.min(100,Math.round((q?q.d.size:0)/Math.max(1,len)*100))}}).sort((a,b)=>b.pct-a.pct);
